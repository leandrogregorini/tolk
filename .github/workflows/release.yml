name: release

# A pull-request merge is a push to main. The version-bump commit is pushed
# with the workflow token, which does not start another run. The message
# check is a second guard against releasing that commit again.
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the mod
        run: claude plugin validate . --strict

      - name: Run the tests
        run: claude plugin test .

      - name: Bump versions and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main moved during this run. A newer commit will be released."
            exit 0
          fi

          VERSION="$(node .github/scripts/bump-version.mjs)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json .claude-plugin/marketplace.json
          git commit -m "release: tolk v${VERSION}"
          git push origin HEAD:main

          TAG="tolk--v${VERSION}"
          git tag -a "$TAG" -m "tolk v${VERSION}"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "tolk v${VERSION}" \
            --generate-notes \
            --target "$(git rev-parse HEAD)"
